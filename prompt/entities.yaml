# Generated by the extract-entities skill (.claude/skills/extract-entities)
# from prompt/tree-prompt.yaml.
#
# entity-types: animate beings named or described in first-hand-snippets
#   (direct witness testimony) only.
# context-only-entity-types: animate beings that appear only in
#   general-reputation, observation-list, or personal-musings — never
#   first-hand evidence. Kept in a separate key on purpose so the two are
#   never confused.

entity-types:

  ami-d-enfance:
    - name: Gérard Guillemette
      document-reference: questionnaire-lorraine
      quote: "Gérard Guillemette, ami d'enfance (40 ans, laboureur)"
    - name: Jean Waterin
      document-reference: questionnaire-lorraine
      quote: "Jean Waterin, ami d'enfance (45 ans, laboureur)"
    - name: Hauviette, femme de Gérard de Syonne
      document-reference: questionnaire-lorraine
      quote: "Hauviette, femme de Gérard de Syonne, amie d'enfance (45 ans, laboureur)"
    - name: Isabelle, femme de Gérardin d'Épinal
      document-reference: questionnaire-lorraine
      quote: "Isabelle, femme de Gérardin d'Épinal, amie d'enfance (50 ans, laboureur)"
    - name: Simonin Musnier
      document-reference: questionnaire-lorraine
      quote: "Simonin Musnier, voisin et ami d'enfance (44 ans, laboureur)"

  charron:
    - name: Jean Moen
      document-reference: questionnaire-lorraine
      quote: "Jean Moen, voisin (56 ans, charron)"

  chevalier:
    - name: Pierre de Bourlemont
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "Il appartenait, d'après le commun dire, à monseigneur Pierre de Bourlemont, chevalier."
    - name: Pierre Gravier
      document-reference: questionnaire-lorraine
      from: Jeannette, veuve de Thiesselin de Vittel
      quote: "un seigneur appelé seigneur Pierre Gravier, chevalier, seigneur de Bourlemont, allait rencontrer sous cet arbre une certaine dame dénommée Fée"
    - name: Albert d'Ourches
      document-reference: questionnaire-lorraine
      quote: "Albert d'Ourches (60 ans, chevalier): A entendu dire autrefois que jadis les fées venaient sous cet arbre..."

  couvreur:
    - name: Bertrand Lacloppe
      document-reference: questionnaire-lorraine
      quote: "Bertrand Lacloppe (60 ans, couvreur)"

  cultivateur:
    - name: Michel Le Buin
      document-reference: questionnaire-lorraine
      quote: "Michel Le Buin (44 ans, cultivateur)"

  dame:
    - name: Béatrice, femme du seigneur Pierre de Bourlemont
      document-reference: questionnaire-lorraine
      from: Jeannette, veuve de Thiesselin de Vittel
      quote: "dame Béatrice, femme du seigneur Pierre de Bourlemont, avec ses demoiselles et ledit seigneur Pierre"
      note: >
        Judgment call: the same testimony source (bibliotheque-monastique)
        elsewhere places an unnamed "dame châtelaine... la femme du seigneur
        Pierre de Bourlemont" at the tree, and a questionnaire-lorraine
        deposition (Isabelle) mentions an unnamed "son épouse, qui était de
        France." Both are plausibly this same Béatrice, but no single
        snippet states the identity outright, so they are not merged into
        this entry — flagged here rather than resolved silently.
    - name: femme de Pierre de Bourlemont (non nommée dans ce passage)
      document-reference: bibliotheque-monastique
      quote: "J'ai vu une dame châtelaine de notre village, la femme du seigneur Pierre de Bourlemont... aller quelquefois s'y promener."
      note: "See the note on Béatrice, femme du seigneur Pierre de Bourlemont — possibly the same person, not stated outright."
    - name: mère de Pierre de Bourlemont (non nommée)
      document-reference: bibliotheque-monastique
      quote: "J'ai vu une dame châtelaine de notre village, la femme du seigneur Pierre de Bourlemont, ainsi que la mère dudit seigneur, aller quelquefois s'y promener."
    - name: Catherine de La Roche, femme de Jean de Bourlemont
      document-reference: questionnaire-lorraine
      from: Jeanette, femme de Thévenin Le Royer
      quote: "dame Catherine de La Roche, femme de Jean de Bourlemont, seigneur dudit village avec ses demoiselles y allait se promener"
    - name: dame dénommée Fée
      document-reference: questionnaire-lorraine
      from: Jeannette, veuve de Thiesselin de Vittel
      note: "Also an instance of type fée — see entity-types.fée for the full citation."

  demoiselle:
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      quote: "On emportait avec elles leurs demoiselles et quelques jeunes filles du village."
    - name: "(collective, unnamed)"
      document-reference: questionnaire-lorraine
      from: Gérard Guillemette
      quote: "les dames des seigneurs de Domrémy avaient coutume d'aller avec leurs demoiselles et leurs servantes sous cet arbre pour se promener"

  enfant:
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      quote: "C'est encore de même aujourd'hui; nos enfants font comme nous faisions."
    - name: Jeanne D'Arc
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "J'ai bien puy danser avec les autres enfants, mais j'y ai plus chanté que dansé."

  esprit-malin:
    - name: "(collective, unnamed; witness denies ever witnessing one)"
      document-reference: questionnaire-lorraine
      from: Simonin Musnier
      quote: "bien qu'il n'eût lui-même jamais vu quelque signe de quelque esprit malin"

  fée:
    - name: Fée (dame dénommée Fée)
      document-reference: questionnaire-lorraine
      from: Jeannette, veuve de Thiesselin de Vittel
      quote: "on raconte qu'anciennement un seigneur appelé seigneur Pierre Gravier, chevalier, seigneur de Bourlemont, allait rencontrer sous cet arbre une certaine dame dénommée Fée, et qu'ils parlaient ensemble"
    - name: "(collective, unnamed — dames fées)"
      document-reference: bibliotheque-monastique
      quote: "Les vieilles gens disaient qu'il était hanté des dames appelées fées. Cependant, je n'ai jamais ouï citer personne qui ait vu les fées."
    - name: "(collective, unnamed — dames fées, also referenced by Jeanne herself)"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "j'ai ouï conter par mon frère qu'on disait dans le pays: « Jeannette a pris son fait près de l'arbre des Fées »"
    - name: "(collective, unnamed — widely referenced across questionnaire-lorraine)"
      document-reference: questionnaire-lorraine
      note: >
        Also stated, with the same collective/unnamed sense, by Béatrice,
        Jeanette femme de Thévenin Le Royer, Bertrand Lacloppe, Gérard
        Guillemette, Hauviette, Jean Waterin, Simonin Musnier, Michel Le
        Buin, and Albert d'Ourches — not repeated here to avoid duplicating
        the same collective instance.
      quote: "on disait jadis que les fées (en français) y allaient"

  fillette:
    - name: Jeanne D'Arc
      document-reference: bibliotheque-monastique
      quote: "Jeannette, en ses jeunes ans, allait quelquefois, en compagnie des autres fillettes, à l'arbre des Dames et à la Fontaine-des-Groseilliers, pour courir et danser avec ses compagnes."

  fiévreux:
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "J'ai ouï dire que les fiévreux boivent de cette fontaine et y vont quérir de l'eau pour se remettre en santé."
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      quote: "que des fiévreux y vont, quoique ce soit profane, pour recouvrer la santé"

  garçon:
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      quote: "Les petits du village, filles et garçons, avec du pain et des noix, allaient à l'arbre des Dames et à la Fontaine-des-Groseilliers..."

  jeune-fille:
    - name: Jeanne D'Arc
      document-reference: questionnaire-lorraine
      from: Jean Morel
      quote: "Jeanne y allait parfois avec les autres jeunes filles et faisait comme les autres"
    - name: "(collective, unnamed — the village's jeunes filles)"
      document-reference: questionnaire-lorraine
      note: >
        This collective group and Jeanne's participation in it are restated
        by nearly every questionnaire-lorraine deponent (Dominique Jacob,
        Béatrice, Jeanette femme de Thévenin Le Royer, Jaquier de
        Saint-Amant, Bertrand Lacloppe, Perrin Drappier, Hauviette, Jean
        Waterin, Gérardin d'Épinal, Simonin Musnier, Isabelle, Colin fils de
        Jean Colin, Nicolas Bailly, Bertrand de Poulengy, Jean Jaquard) —
        not repeated here to avoid duplicating the same collective instance.
      quote: "les jeunes filles et les jeunes gens de Domrémy vont sous cet arbre pour danser"

  jeune-homme:
    - name: "(collective, unnamed — jeunes gens)"
      document-reference: questionnaire-lorraine
      from: Jean Morel
      quote: "les jeunes filles et les jeunes gens de Domrémy vont sous cet arbre pour danser"

  laboureur:
    - name: Jean Morel
      document-reference: questionnaire-lorraine
      quote: "Jean Morel, parrain de Jeanne (70 ans, laboureur)"
    - name: Béatrice, veuve de Thévenin d'Estellin
      document-reference: questionnaire-lorraine
      quote: "Béatrice, veuve de Thévenin d'Estellin, marraine (80 ans, laboureur)"
    - name: Jaquier de Saint-Amant
      document-reference: questionnaire-lorraine
      quote: "Jaquier de Saint-Amant (60 ans, laboureur)"
    - name: Gérard Guillemette
      document-reference: questionnaire-lorraine
      quote: "Gérard Guillemette, ami d'enfance (40 ans, laboureur)"
    - name: Hauviette, femme de Gérard de Syonne
      document-reference: questionnaire-lorraine
      quote: "Hauviette, femme de Gérard de Syonne, amie d'enfance (45 ans, laboureur)"
    - name: Jean Waterin
      document-reference: questionnaire-lorraine
      quote: "Jean Waterin, ami d'enfance (45 ans, laboureur)"
    - name: Gérardin d'Épinal
      document-reference: questionnaire-lorraine
      quote: "Gérardin d'Épinal, le bourguignon (45 ans, laboureur)"
      note: "Also called \"le bourguignon\" (the Burgundian) in his own deposition header — a regional-origin nickname, not catalogued as a separate entity type here."
    - name: Simonin Musnier
      document-reference: questionnaire-lorraine
      quote: "Simonin Musnier, voisin et ami d'enfance (44 ans, laboureur)"
    - name: Isabelle, femme de Gérardin d'Épinal
      document-reference: questionnaire-lorraine
      quote: "Isabelle, femme de Gérardin d'Épinal, amie d'enfance (50 ans, laboureur)"
    - name: Colin, fils de Jean Colin
      document-reference: questionnaire-lorraine
      quote: "Colin, fils de Jean Colin (50 ans, laboureur)"
    - name: Durand Laxart
      document-reference: questionnaire-lorraine
      quote: "Durand Laxart, l'oncle de Jeanne (60 ans, laboureur)"
    - name: Jean Jaquard
      document-reference: questionnaire-lorraine
      quote: "Jean Jaquard (47 ans, laboureur)"

  malade:
    - name: "(collective, unnamed)"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "J'ai oui dire que les malades une fois relevés, vont à cet arbre pour se divertir."

  marguillier:
    - name: Perrin Drappier
      document-reference: questionnaire-lorraine
      quote: "Perrin Drappier, marguillier (60 ans)"

  marraine:
    - name: Béatrice, veuve de Thévenin d'Estellin
      document-reference: questionnaire-lorraine
      quote: "Béatrice, veuve de Thévenin d'Estellin, marraine (80 ans, laboureur)"
    - name: Jeanette, femme de Thévenin Le Royer
      document-reference: questionnaire-lorraine
      quote: "Jeanette, femme de Thévenin Le Royer, marraine (70 ans)"
      note: >
        Distinct person from Jeanne D'Arc herself and from Jeanne, femme du
        maire Rubery (below) — this corpus reuses the name Jeanne/Jeanette
        for several different people.
    - name: Jeanne, femme du maire Rubery
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "J'ai même ouï dire à une de mes marraines, nommée Jeanne, femme du maire Rubery, qu'elle-même avait vu là des fées."
      note: "Distinct person from Jeanne D'Arc and from Jeanette, femme de Thévenin Le Royer, above."

  oncle:
    - name: Durand Laxart
      document-reference: questionnaire-lorraine
      quote: "Durand Laxart, l'oncle de Jeanne (60 ans, laboureur)"

  parrain:
    - name: Jean Morel
      document-reference: questionnaire-lorraine
      quote: "Jean Morel, parrain de Jeanne (70 ans, laboureur)"

  prêtre:
    - name: Dominique Jacob
      document-reference: questionnaire-lorraine
      quote: "Dominique Jacob (35 ans, prêtre)"
    - name: Jean Colin
      document-reference: questionnaire-lorraine
      quote: "Jean Colin (66 ans, prêtre)"
    - name: Henri Arnolin
      document-reference: questionnaire-lorraine
      quote: "Henri Arnolin (64 ans, prêtre)"
    - name: le curé (non nommé)
      document-reference: questionnaire-lorraine
      from: Béatrice
      quote: "La veille de l'Ascension, quand le curé porte les croix par les champs, il va lui aussi sous cet arbre et y chante l'évangile, ainsi qu'à la fontaine aux Rains et aux autres fontaines."

  sainte:
    - name: Les saintes (collective, unnamed voices)
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "interrogateur - Les saintes vous ont-elles parlé à la fontaine proche de l'arbre? Jeanne D'Arc - Oui, je les y ai entendues; mais je ne me rappelle pas ce qu'elles m'y ont dit."
    - name: Les saintes (collective, unnamed voices)
      document-reference: bibliotheque-monastique
      quote: "Lesdites saintes lui ont plusieurs fois parlé près d'une fontaine, située près d'un grand arbre, appelé communément l'arbre des fées."

  seigneur:
    - name: Pierre de Bourlemont
      document-reference: bibliotheque-monastique
      quote: "la femme du seigneur Pierre de Bourlemont"
    - name: Jean de Bourlemont
      document-reference: questionnaire-lorraine
      from: Jeanette, femme de Thévenin Le Royer
      quote: "dame Catherine de La Roche, femme de Jean de Bourlemont, seigneur dudit village"
    - name: Pierre Gravier
      document-reference: questionnaire-lorraine
      from: Jeannette, veuve de Thiesselin de Vittel
      quote: "un seigneur appelé seigneur Pierre Gravier, chevalier, seigneur de Bourlemont"
      note: "Also an instance of type chevalier — see entity-types.chevalier."

  servante:
    - name: "(collective, unnamed)"
      document-reference: questionnaire-lorraine
      from: Gérard Guillemette
      quote: "les dames des seigneurs de Domrémy avaient coutume d'aller avec leurs demoiselles et leurs servantes sous cet arbre pour se promener"

  tabellion:
