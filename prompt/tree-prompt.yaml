- text:  There is also a tree beside a vineyard which they call “l’arbre de la Pucelle,” but there is nothing remarkable about it. 
  document-reference: michel-montaigne
- text: Le lieu où se dresse aujourd’hui la basilique Sainte Jeanne à Domrémy est connu depuis l’origine de l´épopée johannique. 
  document-reference: balades-historiques
- text: Etienne Hordal – Chanoine de Toul et petit-neveu de Jeanne d’arc, y avait fait élever une chapelle entre 1600 et 1610 « « au lieu même où l’on dit que Jeanne avait reçu de Dieu commandement d’aller trouver le Roi »
  document-reference: balades-historiques
- text: De la lisière du Bois Chenu ou de l’Arbre des Fées, Jeanne pouvait apercevoir, pour ainsi dire à portée de la main, le clocher de Saint-Elophe. Elle si pieuse, elle avait dû aller en pèlerinage à la Châsse de sainte Libaire, conservée à l’église de Grand, de même qu’elle allait porter des bouquets et des guirlandes, ou faire brûler des cierges à Notre-Dame de Bermont. Le Bois Chenu lui-même devait avoir son sanctuaire ou son ermitage à la place où, au début du XVIIe siècle, Étienne Hordal fit construire sa chapelle de Notre-Dame.
  document-reference: academie-francaise
- text: 'En toute simplicité, Jeanne vivait comme les gens de son village, participant à leurs réjouissances, de même qu’à leurs travaux et à leurs tribulations. Le dimanche de Loetare, elle allait, comme on disait, « faire ses fontaines » avec les autres jeunes filles de Domremy. Faire ses fontaines, c’est aller boire l’eau des sources, que le curé, en une cérémonie spéciale, avait préalablement bénites. On banquetait sous l’Arbre des Fées, un hêtre colossal et très vieux, dont les branches et les rameaux touchaient presque terre, de manière à former comme une tente naturelle. On étendait sur l’herbe une belle nappe blanche, on y disposait des petits pains faits tout exprès pour la fête. On mangeait un repas frugal, arrosé de vin gris, qu’on avait apporté du logis. Puis, on s’amusait à suspendre des guirlandes aux branches du bel arbre, sans doute des guirlandes d’aubépine en cette époque printanière de l’année : car, s’il faut en croire un témoin, Gérardin d’Epinal, l’arbre était alors « beau comme les lys » : quia tunc est pulchra sicut lilia. On plaisantait — on daillait, comme on dit en Lorraine — on dansait et on chantait. Et après cette journée d’honnête liesse, on s’en revenait tranquillement au logis.'
  document-reference: academie-francaise
- text: « L’arbre des Fées, dit Béatrix, veuve d’Estellin, laboureur de Domrémy, qui avait quatre-vingts ans lorsqu’elle fit sa déposition, l’arbre des fées se trouve près du grand chemin qui conduit à Neufchâteau. La beauté de cet arbre attirait sous son ombre nos seigneurs et leurs dames ; bien des fois je m’y suis promenée en leur compagnie dans ma jeunesse. D’après ce que j’ai ouï conter, les femmes qu’on appelle fées y venaient autrefois, mais, pour nos péchés, elles n’y viennent plus. La veille de l’Ascension, à la procession où les croix sont portées par les champs, le curé va sous le grand Fau et y chante l’évangile. Il va aussi à la Fontaine aux Groseilliers et aux autres fontaines pour chanter l’évangile ; ce sont faits que j’ai vus. 
  document-reference: biblisem
- text: Tout proche, à l’orée du bois, au-dessus du grand chemin de Neufchâteau, s’élevait un hêtre très vieux qui répandait une belle et grande ombre2. Il était vénéré presque à l’égal de ces arbres tenus pour sacrés avant que les hommes apostoliques eussent évangélisé les Gaules3. Ses branches, qu’aucune main n’osait toucher, descendaient jusqu’à terre. Les lis, disait un laboureur, ne sont pas plus beaux4. Comme la fontaine, l’arbre avait plusieurs noms. On l’appelait l’Arbre-des-Dames, l’Arbre-aux-Loges-les-Dames, l’Arbre-des-Fées, l’ArbreCharmine-Fée-de-Bourlémont, le Beau-Mai5. 
  document-refence: mediterranee-antique
- text: L'emplacement " de cette chapelle se voit encore aujourd'hui à i,4oo mètres environ de distance des dernières maisons de Domremy, vers le sud. Elle fut, dit-on, détruite au temps des guerres de religion, peut-être à la même époque où la statue de l'héroïne fut brisée ^ à Orléans. Il ne reste plus rien aujourd'hui dans cet emplacement, qu'un énorme tas de pierres ramassées dans les champs par les cultivateurs, et sous lequel sont cachées certainement les fondations de l'édifice. Les plus anciens de la commune de Domremy se souviennent encore de les avoir vues. Ils assurent même avoir aperçu dans les décombres une pierre que l'on disait être le dessus de l'autel. C'est aux environs de cette chapelle que devait être l'arbre des fées'^, a l'ombre duquel les jeunes garçons et les jeunes filles de Domremy venaient se reposer et se livrer aux jeux de leur âge. La tradition du pays a conservé le souvenir de cet arbre extraordinaire , qui était un hêtre d'une grande beauté, dont, suivant les expressions mêmes d'un habitant de Domremy, appelé à déposer au procès de la Pucelle, les antiques rameaux chargés d'un riche feuillage se courbaient en voûtes obscures, impénétrables, et descendaient jusquà terre. Les plus âgés de Domremy se rappellent encore avoir entendu dire que cet arbre avait été arraché par un habitant nommé Soudart. 
  document-reference: jollois
- text: L'arbre des fées était placé près d'une fontaine qui , d'après ce qu'en rapportent les plus anciens de Domremy , s'appelait la fontaine de l'Ermite. Comme il existe plusieurs sources sur le penchant de la côte où se trouve le vignoble connu sous le nom de la Pucelle, il est difficile d'indiquer quelle est cette fontaine; mais il est assez probable que c'est celle même des groseillers dont nous ferons bientôt mention , et qui alimente aujourd'hui la fontaine élevée sur la place de Domremy , à la mémoire de Jeanne d'Arc. 
  document-reference: jollois
- text: Le monument plus spécialement consacré à rappeler la mémoire de l'héroïne du quinzième siècle est érigé sur la place ' de Domremy, qui a été à cet effet nivelée et exhaussée de manière à la mettre à l'abri des inondations ordinaires de la Meuse. Les terres rapportées sont maintenues par des murs en talus construits à pierres sèches. Sur le sommet de ces murs on a établi une barrière en bois qui dessine tout l'extérieur de la place. Le monument^ consiste en une fontaine d'eaux jaillissantes amenées de la source des Groseillers, située à sept cents mètres de distance de la place de Domremy, et non loin, probablement, de l'endroit où existait l'arbre des fées. 
  document-reference: jollois
- text: La chapelle dont il est ici parlé est nommée, comme on le voit, Notre-Dame de Domrémy (1), et ne doit pas être confondue avec l'ermitage de Notre-Dame de Bermont, situé de l'autre côté de Domrémy. On en montre encore l'emplacement, signalé naguère par des ruines et aujourd'hui par des décombres, vers le lieu où la tradition plaçait l'arbre des Dames.
  document-refence: ste-jeannedarc.fr
  author: Jeanne d'Arc - Henri Wallon - 5° éd. 1879
- text: On se rappelle que la Basilique en construction a pour assises les ruines d’une antique chapelle, dont le constructeur fut Étienne Hordal, grand doyen de la cathédrale de Toul, et petit neveu de Jeanne d’Arc
  document-refence: jeanne.wiki
- text: 'Cette fontaine des Rains est souvent traduite par fontaine des "groseilles". Certains ont dit que "rains" pourrait être "grenouilles". Il semble que sur l''acte d''accensement des biens en faveur de Gérardin d''Epinal en 1442 (photo), les termes "La Loge les Dames" (arbre des fées) et "Grouselier" accrédite la traduction "fontaine des groseilles". (ndlr)'
  document-refence: dep_gerardin_epinal

