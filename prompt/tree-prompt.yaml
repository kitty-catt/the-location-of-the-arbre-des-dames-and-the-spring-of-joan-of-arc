first-hand-snippets:
- text: Il y avait chez nous un arbre que, depuis l’ancien temps, on nommait l’arbre des Dames. Les vieilles gens disaient qu’il était hanté des dames appelées fées. Cependant, je n’ai jamais ouï citer personne qui ait vu les fées.
  document-reference: bibliotheque-monastique
- text: Les petits du village, filles et garçons, avec du pain et des noix, allaient à l’arbre des Dames et à la Fontaine-des-Groseilliers, le dimanche de Laetare Jerusalem, appelé le dimanche des Fontaines.
  document-reference: bibliotheque-monastique
- text: Il y avait chez nous un arbre qu’on appelait aux Loges-les-Dames. C’est un arbre bien ancien. Les vieilles l’ont toujours vu là où il est. Chaque année, au printemps, particulièrement le dimanche de Laetare Jerusalem, dit le dimanche des Fontaines, cet arbre était un lieu de rendez-vous. Filles et garçons y venaient en bande, apportant de petits pains. J’y fus souvent avec Jeannette. Nous mangions sous l’arbre, puis nous allions boire à la Fontaine-des-Groseilliers. Que de fois nous avons mis la nappe sous l’arbre et mangé ensemble! Après cela, on jouait, on dansait. C’est encore de même aujourd’hui; nos enfants font comme nous faisions.
  document-reference: bibliotheque-monastique
- text: Ce dimanche-là, toute la jeunesse du village, garçons et filles, va à l’arbre jouer et danser. Jeannette venait danser et jouer avec nous. Comme nous, elle portait son petit pain, et puis s’en venait boire à la Fontaine-des-Groseilliers. Aujourd’hui, on va encore à l’arbre des Dames, et petits pains, jeux et danses, tout est resté de mode.
  document-reference: bibliotheque-monastique
- text: Il y a chez nous un arbre qu’on appelle communément l’arbre des Dames. J’ai vu une dame châtelaine de notre village, la femme du seigneur Pierre de Bourlemont, ainsi que la mère dudit seigneur, aller quelquefois s’y promener. Elles emmenaient avec elles leurs demoiselles et quelques jeunes filles du village. On emportait du pain, des oeufs, du vin. Au printemps et le dimanche Laetare, que nous appelons dimanche des Fontaines, filles et garçons ont coutume d’aller à l’arbre des Dames et aux Fontaines. Ils emportent des petits pains, et mangent sous l’arbre, et s’amusent, et chantent, et dansent. Jeannette, en ses jeunes ans, allait quelquefois, en compagnie des autres fillettes, à l’arbre des Dames et à la Fontaine-des-Groseilliers, pour courir et danser avec ses compagnes.
  document-reference: bibliotheque-monastique
- text: Près de Domrémy il y avait un arbre appelé l’arbre des Dames ; d’autres l’appelaient l’arbre des Fées. Auprès est une fontaine. J’ai ouï dire que les fiévreux boivent de cette fontaine et y vont quérir de l’eau pour se remettre en santé. Je l’ai vu moi-même, mais je ne sais s’ils guérissent ou non.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: J’ai oui dire que les malades une fois relevés, vont à cet arbre pour se divertir. Il y a un grand arbre appelé le Fou, d’où vient le beau mai. Il appartenait, d’après le commun dire, à monseigneur Pierre de Bourlemont, chevalier.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text:  J’allais parfois avec d’autres filles m’ébattre au pied de l’arbre et j’y faisais des guirlandes pour l’image de la Notre-Dame de Domrémy. Souventes fois j’ai ouï dire par des anciens, — non ceux de mon lignage —que les dames fées le hantaient. J’ai même ouï dire à une de mes marraines, nommée Jeanne, femme du maire Rubery, qu’elle-même avait vu là des fées. J’ignore si c’était vrai ou non. Je n’ai, moi, jamais vu les fées près de cet arbre, que je sache. Si j’en ai vu ailleurs, je ne sais s je les ai vues ou non.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: J’ai vu des filles mettre des guirlandes aux branches de cet arbre ; moi-même j’y en ai mis avec les autres. Tantôt nous les emportions, tantôt nous les laissions.
  document-reference: bibliotheque-monastique
- text: A partir du moment où je sus que je devais venir en France, je m’en retirai et donnai aux jeux et promenades le moins que je pus. Je ne sais même si, depuis l’âge de raison, j’ai dansé au pied de l’arbre. J’ai bien puy danser avec les autres enfants, mais j’y ai plus chanté que dansé.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: 'Je ne sais et n’ai pas oui dire qu’il fût hanté par les fées. Mais j’ai ouï conter par mon frère qu’on disait dans le pays: « Jeannette a pris son fait près de l’arbre des Fées » Il n’en est rien et je le lui ai dit.'
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: interrogateur - Les saintes vous ont-elles parlé à la fontaine proche de l’arbre?  Jeanne D'Arc - Oui, je les y ai entendues; mais je ne me rappelle pas ce qu’elles m’y ont dit.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Interroguée quant elle mectoit chappeaulx en l’arbre, s’elle les meictait en l’onneur de celles qui iny appairaient, R. Que non.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item ladite Jeanne avait coutume de fréquenter lesdits arbre et fontaine [de Domremy] et souvent de nuit; quelquefois de jour, principalement aux heures des offices, afin d’y être seule; elle a pris part à des rondes qui s’opéraient en dansant à l’entour; ensuite elle appendait aux branches de l’arbre des guirlandes formées de diverses herbes et fleurs, en disant et chantant auparavant, ainsi qu’après, certains poèmes et chansons, accompagnés d’invocations, sortilèges et de maléfices; desquelles guirlandes le lendemain matin il ne se retrouvait plus rien
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Lesdites saintes lui ont plusieurs fois parlé près d’une fontaine, située près d’un grand arbre, appelé communément l’arbre des fées. La renommée court au sujet de ces arbres et fontaine que les dames fées les hantent et que des fiévreux y vont, quoique ce soit profane, pour recouvrer la santé. Là et ailleurs elle a révéré lesdites saintes et leur a fait révérence.
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Quand le château était en prospérité, les seigneurs du village et leurs dames allaient prendre du bon temps aux Loges-les-Dames. 
  document-reference: bibliotheque-monastique
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: 'Jean Morel, parrain de Jeanne (70 ans, laboureur): Entendit dire autrefois que des femmes ou personnes surnaturelles, on les appelait fées, allaient anciennement danser sous l’arbre appelé des dames ; mais, à ce qu’on dit, après une lecture de l’évangile de saint Jean, elles n’y vont plus.— Encore aujourd’hui, le dimanche de Lætare [4e dimanche de Carême] communément appelé dimanche des Fontaines, et les jours de fêtes au printemps et en été, les jeunes filles et jeunes gens de Domrémy vont sous cet arbre pour danser ; parfois ils y déjeunent ; et en revenant ils vont à la fontaine aux Rains, qui est plus près du village que l’arbre, en se promenant et chantant, y boivent son eau et autour s’amusent à cueillir des fleurs. — Jeanne y allait parfois avec les autres jeunes filles et faisait comme les autres ; il n’entendit jamais dire que Jeannette fût allée seule, ni pour d’autres raisons, à cet arbre et à cette fontaine, si ce n’est pour se promener et s’amuser comme les autres.'
  document-reference: questionnaire-lorraine
- text: 'Dominique Jacob (35 ans, prêtre): L’arbre en question est appelé communément l’arbre des dames. Le dimanche de Lætare, qu’on appelle ici dimanche des Fontaines, ou pendant le printemps, les jeunes filles, les enfants et les jeunes gens de Domrémy viennent à cet arbre pour chanter, et emportent avec eux du pain ; en revenant ils vont à la fontaine des Rains, mangent leur pain et boivent de cette eau ; et ils font cela pour se promener. Il a vu Jeanne venir et aller avec les jeunes filles, et elle faisait comme les autres. Cet arbre est d’un aspect étonnant et admirable, raison pour laquelle, selon lui, les jeunes filles et les enfants vont volontiers danser sous lui.'
  document-reference: questionnaire-lorraine
- text: 'Béatrice, veuve de Thévenin d’Estellin, marraine (80 ans, laboureur): L’arbre était appelé l’arbre des dames. — Le témoin y alla autrefois avec les seigneurs du village et leurs femmes pour s’y promener, à cause de sa beauté. — Cet arbre se trouve à côté du grand chemin par lequel on va à Neufchâteau ; et autrefois entendit dire qu’anciennement les dames fatales, en français les fées, allaient sous cet arbre ; mais n’y vont plus à cause des péchés. — Les jeunes gens et les jeunes filles de Domrémy, chaque dimanche de Lætare, qu’on appelle ici dimanches des Fontaines, et au printemps, vont à cet arbre, et Jeannette y allait avec eux, et sous l’arbre chantent et font des chœurs, déjeunent ; en revenant, vont à la Fontaine aux Rains et boivent son eau. — La veille de l’Ascension, quand le curé porte les croix par les champs, il va lui aussi sous cet arbre et y chante l’évangile, ainsi qu’à la fontaine aux Rains et aux autres fontaines.'
  document-reference: questionnaire-lorraine
- text: 'Jeanette, femme de Thévenin Le Royer, marraine (70 ans): L’arbre est appelé l’arbre des dames. — Entendit dire que les femmes des seigneurs du village de Domrémy allaient autrefois se promener sous cet arbre. Lui semble que dame Catherine de La Roche, femme de Jean de Bourlemont, seigneur dudit village avec ses demoiselles y allait se promener. — Les jeunes filles et les jeunes gens de Domrémy, au printemps et au dimanche des Fontaines vont sous cet arbre, y chantent, font des danses, apportent du pain et mangent, vont ensuite à la Fontaine aux Rains et boivent de son eau. — Jeannette y allait avec les autres jeunes filles ; n’a jamais vu ni appris que Jeannette serait allée autrement sous cet arbre.'
  document-reference: questionnaire-lorraine
- text: 'Jean Moen, voisin (56 ans, charron): L’arbre mentionné est près d’un bois, au bord du grand chemin par lequel on va à Neufchâteau. Les jeunes gens et jeunes filles du village, tous les ans, le dimanche des Fontaines, ont coutume d’aller se promener sous cet arbre, et là ils déjeunent joyeusement, vont aux fontaines près de cet arbre pour boire.'
  document-reference: questionnaire-lorraine
- text: 'Jeannette, veuve de Thiesselin de Vittel (60 ans): L’arbre est appelé l’arbre des dames, car on raconte qu’anciennement un seigneur appelé seigneur Pierre Gravier, chevalier, seigneur de Bourlemont, allait rencontrer sous cet arbre une certaine dame dénommée Fée, et qu’ils parlaient ensemble ; l’a entendu lire dans un roman. Les seigneurs et dames de Domrémy, ainsi dame Béatrice, femme du seigneur Pierre de Bourlemont, avec ses demoiselles et ledit seigneur Pierre, allaient parfois, à ce qu’on disait, se promener jusqu’à cet arbre. — Les jeunes filles et les jeunes gens du village vont chaque année, le dimanche de Lætare appelé des Fontaines, s’y promener, et là déjeunent et dansent, et vont boire à la Fontaine aux Rains. Ne se rappelle pas si Jeanne y alla jamais. N’a jamais entendu dire que cette Jeannette fut jamais diffamée à propos de cet arbre.'
  document-reference: questionnaire-lorraine
- text: 'Thévenin Le Royer (56 ans): A entendu dire qu’anciennement les seigneurs et les dames du village de Domrémy, comme le seigneur Pierre de Bourlemont, son épouse, et d’autres serviteurs et demoiselles allaient se promener sous cet arbre. — Encore actuellement les jeunes filles et jeunes gens du village, au dimanche des Fontaines et à l’époque du printemps, vont sous cet arbre, emportant de petits pains, et là se promènent et mangent, dansent et font des rondes, et Jeanne allait avec eux. Il n’a jamais entendu dire que Jeanne allait seule à cet arbre, ou pour une autre raison, sans lesdites jeunes filles.'
  document-reference: questionnaire-lorraine
- text: 'Jaquier de Saint-Amant (60 ans, laboureur): Les seigneurs féodaux et les dames du village allaient communément se promener sous cet arbre. Encore actuellement jeunes filles et jeunes gens du village vont sous cet arbre au printemps et en été, et au jour des Fontaines en emportant des pains pour les manger là et se promener. — Dans sa jeunesse, Jeanne allait aussi à cet arbre avec des jeunes filles se promener aux jours indiqués.'
  document-reference: questionnaire-lorraine
- text: 'Bertrand Lacloppe (60 ans, couvreur): L’arbre qu’on appelle arbre des dames est un hêtre, et il est très courbé. On disait jadis que les fées (en français) y allaient ; cependant il n’a jamais vu, ni entendu dire à l’époque que lesdites fées fussent allées sous cet arbre. — Au printemps et le dimanche des Fontaines, les jeunes filles et jeunes gens du village, allaient parfois à cet arbre, avec Jeanne parmi eux, et à la fontaine proche, pour se promener et faire des rondes ; ils avaient aussi l’habitude d’y manger. — Jamais il n’entendit dire que Jeanne était allée seule à cet arbre.'
  document-reference: questionnaire-lorraine
- text: 'Perrin Drappier, marguillier (60 ans): L’arbre en question est appelé l’arbre des dames. — Il vit une dame du village, qui était la femme du seigneur Pierre de Bourlemont, et la mère de ce seigneur aller parfois vers cet arbre pour se promener ; avec eux ils emmenaient leurs demoiselles et quelques jeunes filles du village, et ils portaient du pain et du vin avec des œufs. — Au printemps et le dimanche de Lætare, appelé dimanche des Fontaines, les jeunes filles et les jeunes gens du village ont coutume d’aller à cet arbre et aux fontaines ; ils emportent de petits pains et mangent sous cet arbre, et se promènent en faisant des rondes et en chantant. — Jeanne dans sa jeunesse y alla parfois avec les jeunes filles du village, se promener et faire des rondes vers l’arbre et à la fontaine des Rains.'
  document-reference: questionnaire-lorraine
- text: 'Gérard Guillemette, ami d’enfance (40 ans, laboureur): L’a souvent entendu appeler l’arbre des fées. — Jadis, les dames des seigneurs de Domrémy avaient coutume d’aller avec leurs demoiselles et leurs servantes sous cet arbre pour se promener. — Au dimanche de Lætare, appelé des Fontaines, les jeunes filles et les jeunes gens de Domrémy y vont parfois pour faire leurs fontaines et se promener ; ils apportent du pain et mangent là ; ensuite ils reviennent à la fontaine des Rains et boivent de son eau. — Il y vit une fois Jeannette avec les jeunes filles, mais ne la revit plus ensuite. — Les jeunes filles et jeunes gens de Greux vont faire leurs fontaines à l’église Notre-Dame de Bermont.'
  document-reference: questionnaire-lorraine
- text: 'Hauviette, femme de Gérard de Syonne, amie d’enfance (45 ans, laboureur): L’arbre est appelé l’arbre des dames depuis l’ancien temps. On disait qu’avant, les dames appelées fées allaient à cet arbre, mais elle-même n’a jamais entendu dire que quelqu’un les ait vues. — Les jeunes filles et jeunes gens du village avaient l’habitude d’aller à cet arbre et à la fontaine des Rains le dimanche de Lætare, dit des Fontaines, et emportaient du pain. — Elle-même y alla avec Jeanne, qui était son amie, et avec d’autres jeunes filles ; on y mangeait, on se promenait, on jouait. — Elle a vu porter des noix autour de cet arbre et aux fontaines.'
  document-reference: questionnaire-lorraine
- text: 'Jean Waterin, ami d’enfance (45 ans, laboureur): L’arbre est communément appelé l’arbre des dames. Entendit dire que jadis des femmes appelées fées s’y rendaient ; mais n’entendit jamais dire que quelqu’un les y ait vues. — À l’été et au dimanche des Fontaines, les jeunes filles et les jeunes gens de Domrémy ont coutume d’aller sous l’arbre, apportent de petits pains, et les mangent et dansent dessous ; puis au retour vont à la fontaine des Rains ou parfois à d’autres fontaines, et boivent. — Il vit Jeanne s’y rendre ainsi, avec d’autres jeunes filles, pour jouer et se promener comme elles.'
  document-reference: questionnaire-lorraine
- text: 'Gérardin d’Épinal, le bourguignon (45 ans, laboureur): L’arbre est appelé l’arbre des dames. — Il vit les seigneurs féodaux de Domrémy et leurs femmes au printemps, une ou deux fois, qui portaient du vin et du pain et allaient manger sous l’arbre, car celui-ci est beau comme les lys, épanoui, et ses feuilles et branches viennent jusqu’à terre. — Les filles et les jeunes gens du village de Domrémy ont l’habitude, au dimanche des Fontaines, d’aller à cet arbre ; les mères leur font des pains et ils vont sous cet arbre faire leurs fontaines ; ils y chantent, font des rondes, et ensuite reviennent à la fontaine des Rains, mangent le pain et y boivent de l’eau, comme il le vit. — Jeanne y allait avec les autres jeunes filles et faisait comme elles.'
  document-reference: questionnaire-lorraine
- text: 'Simonin Musnier, voisin et ami d’enfance (44 ans, laboureur): L’arbre est communément appelé l’arbre des dames ; on dit que jadis celles qu’on appelle les fées allaient sous cet arbre, bien qu’il n’eût lui-même jamais vu quelque signe de quelque esprit malin. — Les jeunes filles et jeunes gens vont, au printemps et le dimanche dit des fontaines, sous cet arbre pour faire leurs fontaines ; ils mangent là leur pain, font des rondes, en revenant passent à la fontaine des Rains et boivent de son eau. — Lui-même, avec Jeanne et d’autres, dans son jeune âge, alla vers cet arbre au dimanche des Fontaines, pour jouer et se promener, comme les autres filles et garçons du village.'
  document-reference: questionnaire-lorraine
- text: 'Isabelle, femme de Gérardin d’Épinal, amie d’enfance (50 ans, laboureur): A toujours entendu appeler cet arbre Aux loges des Dames. — Quand le château du village était en bon état, les seigneurs et leurs femmes allaient se délasser sous cet arbre, le dimanche du Lætare, appelé des Fontaines, et parfois en été ils y conduisaient leurs filles et leurs garçons ; elle le sait, car elle accompagna autrefois le sire Pierre de Bourlemont, seigneur du village et son épouse, qui était de France, et plusieurs fois aussi les jeunes filles du village, tant au printemps qu’en ce dimanche des Fontaines. — Les jeunes filles et les jeunes gens du village ont coutume d’y aller le dimanche des Fontaines pour se reposer et se promener ; ils emportent des pains pour manger ; et Jeanne allait avec eux pour se promener et jouer, en emportant son pain ; au retour ils venaient boire à la fontaine des Rains ; selon la coutume qui existe encore.'
  document-reference: questionnaire-lorraine
- text: 'Jean Colin (66 ans, prêtre): Ne sait rien sinon par ouï-dire.'
  document-reference: questionnaire-lorraine
- text: 'Colin, fils de Jean Colin (50 ans, laboureur)  : L’arbre est appelé Aux loges des dames. — Entendit dire que les seigneurs féodaux de Domrémy et leurs femmes avaient coutume d’aller sous cet arbre pour se délasser et se promener. — Les jeunes filles et les jeunes gens du village ont l’habitude d’aller sous cet arbre, au dimanche de Lætare dit des Fontaines, et aussi au printemps et en mai. Parfois, le jour des Fontaines, ils font un homme de mai et apportent de petits pains, chacun ayant le sien ; là ils mangent, dansent, chantent, et au retour vont parfois pour boire à la fontaine des Rains et y boivent ; et ils font cela à cause des loisirs en usage ce jour-là. — N’a jamais vu Jeanne y aller ; mais entendit dire qu’elle y fut avec d’autres, pour se promener et manger, comme le font les jeunes filles.'
  document-reference: questionnaire-lorraine
- text: 'Michel Le Buin (44 ans, cultivateur): L’arbre est appelé Les loges des dames. — A entendu dire que des femmes appelée fées se rendaient autrefois sous cet arbre, mais ignore si c’est vrai puisqu’elles n’y ont plus. — Les jeunes filles et les jeunes gens de Domrémy ont l’habitude d’y aller le dimanche de Lætare, ou des Fontaines, et là font des rondes, mangent, font leurs fontaines en jouant et se promenant ; ensuite vont boire à la fontaine des Rains. — Petite, Jeanne y allait aussi comme les autres pucelles, pour faire ses fontaines ; mais ne croit pas qu’elle y soit allée pour d’autres raisons, parce que c’était une fille tout à fait bonne.'
  document-reference: questionnaire-lorraine
- text: 'Durand Laxart, l’oncle de Jeanne (60 ans, laboureur)  : N’en sait rien car il ne resta pas longtemps à Domrémy.'
  document-reference: questionnaire-lorraine
- text: 'Catherine, femme de Henri Le Royer (54 ans): Ne sait rien sinon qu’on dit que les jeunes vont se promener vers cet arbre.'
  document-reference: questionnaire-lorraine
- text: 'Albert d’Ourches (60 ans, chevalier): A entendu dire autrefois que jadis les fées venaient sous cet arbre, sans que personne ne les eût vues. N’a jamais entendu dire que Jeanne s’y trouvait ; d’ailleurs c’est bien vingt ou trente ans avant qu’on ne parlât de Jeanne, qu’il entendit ces histoires de fées.'
  document-reference: questionnaire-lorraine
- text: 'Nicolas Bailly (60 ans, tabellion): A souvent entendu dire que les jeunes filles de Domrémy ont coutume d’aller sous l’arbre aux jours de fête, au printemps ou en été ; elles y font des rondes et cueillent des fleurs ; Jeanne allait avec elles et faisait comme les autres. A vu une fois ces filles du village, qui revenaient joyeusement de l’arbre.'
  document-reference: questionnaire-lorraine
- text: 'Bertrand de Poulengy (63 ans): A vu plusieurs fois l’arbre en question ; lui-même y alla pendant une douzaine d’années avant d’avoir rencontré Jeanne. A entendu dire que les jeunes filles et les jeunes gens de Domrémy et des autres villages voisins y vont durant l’été se promener et faire des rondes dessous.'
  document-reference: questionnaire-lorraine
- text: 'Henri Arnolin (64 ans, prêtre): A entendu dire autrefois, avant la naissance de Jeanne, que l’arbre était appelé les Loges des dames. Il alla souvent à Domrémy et n’entendit jamais dire que Jeanne se rendait à cet arbre.'
  document-reference: questionnaire-lorraine
- text: 'Jean Jaquard (47 ans, laboureur): Les jeunes filles et jeunes gens ont coutume, l’été et le dimanche des Fontaines, d’aller sous cet arbre, ils chantent, mangent, font des rondes, puis, jouant et se promenant, reviennent à la fontaine des Rains, boivent de son eau. Croit que Jeanne y allait avec les autres filles.'
  document-reference: questionnaire-lorraine
- text: 'Jean Waterin, ami d’enfance (45 ans, laboureur)  : A vu plusieurs fois Jeannette. Dans sa jeunesse il alla avec elle à la charrue du père de Jeanne, ou avec d’autres jeunes filles et elle dans les pâtures et les prés ; et souvent, pendant que les autres jouaient ensemble, Jeanne se tirait à part et parlait à Dieu, comme il lui semblait ; et lui avec les autres se moquait d’elle.'
  document-reference: questionnaire-lorraine
- text: 'Jean Waterin, ami d’enfance (45 ans, laboureur)  : A vu plusieurs fois Jeannette. Dans sa jeunesse il alla avec elle à la charrue du père de Jeanne, ou avec d’autres jeunes filles et elle dans les pâtures et les prés ; et souvent, pendant que les autres jouaient ensemble, Jeanne se tirait à part et parlait à Dieu, comme il lui semblait ; et lui avec les autres se moquait d’elle.'
  document-reference: questionnaire-lorraine
- text: 'Jean Waterin, ami d’enfance (45 ans, laboureur)  : Elle était bonne et franche, fréquentait les églises et les lieux saints ; parfois aussi quand elle était dans les champs et entendait la cloche sonner, elle se mettait à genoux. Elle portait souvent des cierges et allait au pèlerinage de Notre-Dame de Bermont.'
  document-reference: questionnaire-lorraine
- text: 'Jean Waterin, ami d’enfance (45 ans, laboureur)  : L’a vu partir de Greux. Elle disait aux gens : Adieu ! — L’entendit plusieurs fois dire qu’elle relèverait la France et le sang royal.'
  document-reference: questionnaire-lorraine
- text: 'Jean de Metz, Mission divine de Jeanne - Il lui arriva de l’interroger si elle ferait ce qu’elle disait, elle répondait de n’avoir crainte ; Dieu et ses frères du paradis, qui la dirigeaient depuis quatre ou cinq ans déjà, l’envoyaient à la guerre pour recouvrer le royaume de France.'
  document-reference: questionnaire-lorraine
- text: 'Jaquier de Saint-Amant (60 ans, laboureur)  : Lui-même vit Jeannette à Neufchâteau ; elle menait aux champs les animaux de ses parents, qui étaient dans cette ville.'
  document-reference: questionnaire-lorraine
- text: 'Perrin Drappier, marguillier (60 ans)  : Quand les gens du village s’enfuirent à Neufchâteau à cause des bandes armées, Jeanne et ses parents y allèrent et y conduisirent leurs animaux ; après trois ou quatre jours elle revint avec son père à Domrémy.'
  document-reference: questionnaire-lorraine
- text: 'Isabelle, femme de Gérardin d’Épinal, amie d’enfance (50 ans, laboureur)  : Jeanne séjourna à Neufchâteau avec ses parents, ses frères et sœurs, qui avaient conduit les animaux dans cette ville à cause des bandes armées. Elle n’y resta pas longtemps et retourna au village de Domrémy, avec son père, comme le témoin l’a vu, car elle ne voulait pas rester audit lieu et préférait être à Domrémy.'
  document-reference: questionnaire-lorraine
- text: 'Bertrand de Poulengy (63 ans)  : Elle filait, gardait parfois les animaux et les chevaux de son père.'
  document-reference: questionnaire-lorraine
- text: "Gérardin d'Épinal : Dixit per suum iuramentum quod illa arbor vocatur l'obre dominarum. Vidit eciam quod domini et domine temporales de Dompno Remigio, semel aut bis, tempore veris, portabant vinum et panem ; et ibant comestum subtus arborem, quia tunc est pulcra sicut lilia ; et est dispersa, ac folia et rami eius veniunt usque ad terram. Consueverunt enim filie et iuvenes dicte ville de Dompno Remigio, in dominico des Fontaines, ire ad illam arborem ; et matres eorum faciunt panes ; et vadunt dicti pueri et puelle factum suos fontes subtus illam arborem. Cantant ibidem et coreant ; et postea redeunt ad fontem rannorum ; et comedunt panem, et bibunt de aqua illius, prout vidit. Dixitque quod dicta Iohanneta ibat cum aliis puellis ; et faciebat sicut alie puelle faciebant. Nec alias deposuit."
  document-reference: dep_gerardin_epinal
- text: "Mengette: Dixit per suum iuramentum, quod arbor illa vocatur 'ad lobias dominarum', et est antiqua arbor. Non enim unquam audivit dici quod illa arbor non esset ibi. Et dixit quod, annis singulis tempore veris, ac specialiter in die dominico Lætare Iherusalem, dicto des Fontaines, omnes puelle et pueri cum parvis panibus solent ire ad arborem ; ibidemque comedunt. Et ipsa testis fuit pluries cum dicta Iohanna in dicta die, ibidemque comedebant. Et postea veniebant bibitum ad fontem rannorum. Aliquando habebant unam mappam subtus illam arborem. Et comedebant insimul. Et postea iocabant et tripudiebant prout adhuc de presenti alie faciunt. Nec aliud scit"
  document-reference: dep_mengette
- text: "Jean Morel : Dixit per suum iuramentum quod de arbore, que dicitur dominarum, audivit alias dici quod mulieres et persone fatales, que vocabantur lees, ibant antiquitus choreatum sub illa arbore. Sed, ut dicitur, postquam evangelium beati Iohannis legitur et dicitur, amplius non vadunt. Dixit eeiam quod, modernis temporibus, in dominica qua cantatur in sancta Dei ecclesia in introitu misse Letare lherusalem, in istis partibus vulgariter dicta des Fontaines, puelle et iuvenes de Dompno Remigio vadunt subtus illam arborem, et aliquociens tempore veris et estatis, diebus festivis ad coreandum ; et aliquando ibidem comedunt ; et redeundo veniunt supra fontem ad Rannos, spaciando et cantando, et de aqua illius fontis bibunt, et circumcirca ludendo flores colligunt. Dixit eciam quod ipsa Iohanna la Pucelle, cum aliis puellis, dictis temporibus, aliquociens ibat, et sicut cetere faciebat. Nec unquam dici audivit quod Iohanneta articulata sola, nec propter aliam causam, iret ad arborem, nee ad fontem, qui fens est propinquior villa quam sit arbor ; nisi ad spaciandum et iocandum, sicut et alie iuvencule. Nec alias deposuit."
  document-reference: dep_jean_morel
- text: Item elle fut interrogée au sujet de certain arbre existant près de son village. A quoi elle répondit que, assez près de Domrémy, il y a certain arbre appelé l'Arbre des Dames, et les autres l'appellent l'Arbre des Fées ; auprès est une fontaine (6). Et a ouï dire que les gens malades de fièvre boivent à cette fontaine et vont quérir de son eau pour recouvrer santé. Cela, elle l'a vu ; mais ne sait s'ils guérissent ou non. Item dit qu'elle a ouï dire que les malades, quand ils peuvent se lever vont à l'arbre pour s'ébattre. Et c'est un grand arbre, appelé fau (7) d'où vient le beau mai (8) ; et appartenait, à ce qu'on dit, à Messire Pierre de Bourlemont (9), chevalier.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, interrogata fuit de quadam arbore, existente prope villam ipsius. Ad quod respondit quod satis prope villam de Dompremi est quædam arbor, vocata Arbor Dominarum, et alii vocant eam Arborem Fatalium des Faées, juxta quam est unus fons ; et audivit dici quod infirmi febricitantes potant de illo fonte et vadunt quæsitum de aqua illius, pro habenda sanitate. Et hoc ipsamet vidit ; sed nescit utrum inde sanentur, vel non. Item, dicit quod audivit infirmi, quando possunt se levare, vadunt ad arborem pro spatiendo. Et est una magna arbor, vocata Fagus, unde venit mayum, le beau may ; et solebat pertinere domino Petro de Bourlemont, militi.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, interroguee de l'arbre, respond que assez prez de Dompremy d'ung arbre qui ... (10) se appelle l'arbre des Dames ; et les aultres l'appellent l'arbre des Fees ; et auprez a une fontaine ; et a ouy dire que les gens malades des fiebvrez en boyvent ; et mesmes en a veu aller querir pour en guarir. Mais ne sçait se ilz en garissoyent ou non. Item, dit qu'elle a ouy dire que les malades, quand ilz se pevent lever, vont a l'arbre pour leur esbattre ; et dit que c'est ung grand arbre, nommé fou, dont vient de beau may; et souloit estre a messyre Pierre de Bolemont.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item disait que parfois elle allait s'ébattre avec les autres filles, et faisait à cet arbre couronnes pour l'image de Notre-Dame de Domrémy ; et plusieurs fois elle a ouï dire des anciens, non pas de ceux de son lignage, que les dames fées y repairaient. Et a ouï dire à une nommée Jeanne, femme du maire Aubery (11), de Domrémy, qui était sa marraine, qu'elle avait vu les dites dames fées, mais elle qui parle, ne sait si c'était vrai ou non. Item dit qu'elle ne vit jamais les dites fées à l'arbre, qu'elle sache ; interrogée si elle en a vu ailleurs, ne sait si elle en a vu ou non. Item dit qu'elle a vu mettre par les jouvencelles couronnes aux rameaux de l'arbre, et elle même en a mis parfois avec les autres filles ; et parfois elles les emportaient et parfois les y laissaient.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, dicebat quod aliquando ipsa ibat spatiatum cum aliis filiabus, et faciebat apud illam arborem serta pro imagine Beate Mariæ de Dompremi. Et pluries audivit ab antiquis, (non ab illis de sua progenie), quod Dominæ Fatales illuc couversabantur. Et audivit dici ab una muliere, nominata Johanna, uxore Majoris Alberici du Maire Aubery, de illa villa, quæ erat ipsius Johannæ loquentis matrina, quod ipsa ibi viderat prædictas Dominas Fatales ; sed ipsa loquens nescit an utrum hoc esset verum, vel non. Item dixit quod nunquam vidit prædictas Fatales apud arborem, quod ipsa sciat ; sed si, viderit alibi, nescit an viderit, aut non. Item, dixit quod vidit apponere serta in ramis arboris per juvenculas, et ipsamet aliquando ibi apposuit cum aliis filiabus ; et aliquando secum deferebant, aliquando dimittebant.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, qu'elle alloit aucunes foys avecques les aultres jeunes filles en temps d'esté ; et y faisoit des chappeaux pour Nostre Dame de Dompremy. Item, dit qu'elle a ouy dire a plusieurs anciens, non pas de son lignaiges, que les fees y reperoyent ; et a ouy dire a une nommee Jhenne, femme du maire de la ville de Dompremy, sa marraine, qu'elle les avoit veues la. Se il estoit vray, elle ne sçait. Item, dit qu'elle ne veit jamais fee, qu'elle saiche, a l'arbre, ne ailleurs. Item, dit qu'elle avoit veu mectre es branches dudit arbre des chappeaux par les jeunes filles ; et elle mesmes y en a mys avecques les aultres fille. Et aulcunes foys les emportoyent ; et aulcunes foys laissoyent.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item dit que depuis qu'elle sut qu'elle devait venir en France, elle fit peu de jeux ou ébattements, et le moins qu'elle put ; et ne sait point que, depuis qu'elle eut entendement, elle ait dansé près de l'arbre ; mais parfois elle peut bien y avoir dansé avec les enfants ; mais y avait plus chanté que dansé.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, dixit quod, postquam ipsa scivit quod debebat venire in Franciam, parum fecit de jocis sive spatiamentis, et quantum minus potuit. Et nesci quod postquam habuit discretionem, ipsa tripudiaverit juxta illam arborem ; sed aliquando bene potuit ibi tripudiare cum pueris, et plus ibi cantavit quam tripudiaverit.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, dit que, depuis qu'elle sceut qu'elle debvoit venir en France, elle feit pou d'esbattemenz ; et le moins qu'elle peut. Et ne sçait point que, depuis qu'elle eut entendement, qu'elle ait dansé prez dudit arbre. Mais aulcunes foys y peult bien avoir dansé avecques les enfans ; mais y avoit plus chanté que dansé.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: "Item dit qu'il y a un bois chenu (12) qu'on voit de l'huis de sa maison de son père ; et n'y a pas la distance qu'une demi-lieue. Item ne sait ni ouït oncques dire que les dames fées y repairassent ; mais a ouï dire de son frère qu'on disait au pays qu'elle, Jeanne, avait pris son fait à l'arbre des dames fées : mais dit qu'elle ne l'avait pas fait, et elle lui a bien dit le contraire ; et dit en outre que, lorsqu'elle vint vers son roi, certains lui demandaient si, en son pays, il n'y avait point de bois qu'on appelaît le bois chenu ; car il y avait prophétie disant que devers ce bois devait venir une pucelle qui ferait merveille ; mais ladite Jeanne a dit qu'elle n'y a point ajouté de foi (13)."
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: Item, dicit quod est ibi unum nemus, quod vocatur Nemus-quercosum, le Bois-Chenu quod videtur ab ostio patris sui ; et non est distantia dimidiæ Item, nescit nec audivit unquam quod Dominæ Fatales supradictæ ibi conversarentur ; sed audivit dici a fratre suo quod dicebatur in patria quod ipsa johanna ceperat factum suum apud arborem Dominarum Fatalium. Sed dicit quod non fecerat, et dicebat sibi contrarium. Item, ulterius dicit quod, quando ipsa versus regem suum, aliqui petebant sibi an in patria sua erat aliquod nemus, quod vocaretur le Bois chesnu, quia erant prophetiæ dicentes quod, circa illud nemus, debebat venire quædam puella quæ faceret mirabilia. Sed dixit ipsa Johanna quod in hoc non adhibuit fidem.
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: "Item, dit bien qu'il y a ung bosc, que on appelle le Bosc Chesnu, que on voit de l'huys de son pere ; et y a petite espace non pas d'une lieue ; mais qu'elle ne sçait ne ouyt oncques dire que les fees y repperassent. Item, dit qu'elle a ouy dire a son frere que on disoit au pays qu'elle avoit prins ses revelacions a l'arbre et es fees. Mais non avoit. Et luy disoit bien le contraire. Et dit oultre, quand elle vint devers le roy, que aulcuns demandoyent si en son pays avoit point de boys que on appelast le Boys Chesnu. Car il y avoit prophecies qui disoyent que de devers le Boys Chanu debvoit venir une pucelle qui venoit faire merveilles ; mais en ce n'a point adiousté de foy."
  document-reference: interro_public3
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: " Interrogée si saintes Catherine et Marguerite lui parlèrent sous l'arbre mentionné plus haut, répondit : "Je ne sais". lnterrogée si, à la fontaine qui est près de l'arbre, les saintes parlèrent avec elle, répondit que oui, et que là elle les ouït bien mais ce qu'elles lui dirent alors, elle ne le sait plus."
  document-reference: interro_public5
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: "Interrogata an sanctæ Katharina et Margareta locutæ sunt cum ea sub arbore, de qua superius fit mentio, respondit : "Ego nihil scio".  Interrogata si, apud fontem qui est juxta arborem, prædicta Sanctæ locutæ sunt cum ea, respondit quod sic, et quod audivit eas ibi ; sed quid sibi tunc dixerunt, nescit."
  document-reference: interro_public5
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: "Interrogée en quel lieu est cette mandragore dont elle ouït parler répondit qu'elle ouït dire qu'elle est en terre, proche de l'arbre ci-dessus mentionné; mais ne sait le lieu. Et dit qu'elle a ouï dire que sur cette mandragore s'élève un coudrier. Interrogée à quoi elle a entendu dire que sert cette mandragore, répondit qu'elle a ouï dire qu'elle fait venir l'argent ; mais n'a croyance en cela. Et dit que les voix ne lui dirent jamais rien à ce sujet."
  document-reference: interro_public5
  who: Jeanne D'Arc according to the interrogatoire of 1431
- text: "Interrogata quid fecit de sua mandragora, respondit quod non habet mandragoram, nec unquam habuit ; sed audivit dici quod prope villam suam est una, et nunquam vidit aliquam. Dixit etiam quod audivit dici quod est res periculosa et mala ad custodiendum ; nescit tamen de quo deservit. Interrogata in quo loco illa mandragora est, de qua loqui audivit, respondit quod audivit dici quod est in terra, prope illam arborem de qua superius dictum est ; sed nescit locum. Dicit etiam se audivisse dici quod supra illam mandragoram est una corylus. Interrogata de quo audivit dici quod serviat illa mandragora, respondit se audivisse quod facit venire pecunias ; sed non credit in hoc aliquid. Et dicit quod voces suæ nunquam de hoc sibi aliquid dixerunt."
  document-reference: interro_public5
  who: Jeanne D'Arc according to the interrogatoire of 1431


