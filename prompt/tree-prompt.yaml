  output-description: 
  - write a small chapter in a fictional Agatha Christie novel where Hercule Poirot explains where the spring and the tree of Joan of Arc can be found.
  - at the end of the chapter, add the notes of a seasoned police inspector anno 2026 who read the novel with his thought about what was right, and what he would have done with modern police investigation methods
