
user-prompt:
  process-description:
  - pretend that you are a retired modern day police inspector and you have some time to spare
  - the objective is to make your best guess for where to search for the remants of the spring and the tree of the Pucelle
  - read the first-hand-snippets in this user prompt
  - read the candidate-locations in this user prompt and use them as a starting point for your musing
  - consider the practicalities of children visiting the tree
  - consider the practicalities of the Lady de Bourlemont visiting the tree with her demoiselles
  - consider the practicalities of the Lord and Lady de Bourlemont visiting the tree with the mother of the Lord and their demoiselles and servants
  - give the nullification witness accounts as well as Jeanne D'Arc more credibility over other statements
  - think where could a large, socially prominent tree have stood that satisfies all witness acounts simultaneously?
  - think where could the spring have stood that satisfies all witness acounts simultaneously?
  - suggest the best candidate location for the tree, suggest a better location using the candidate-locations as a starting point for your calculations
  - suggest the best candidate location for the spring, suggest a location location using the candidate-locations as a starting point for your calculations
  - give a single geolocation plus a radius for each object
  output-description:
  - give a table where the seasoned police inspector lists, the geolocation of the tree and spring. Provide the confidence score and range around the object where he would search
  - add the notes of a seasoned police inspector who lives at the cutoff time of the AI who read the novel with his thought about what was right, and what he would have done with modern police investigation methods
  performance-description:
  - give me the best supported geolocation for the spring and the tree and explain your reasoning
  personal-musings:
  - Michel de montaigne does not mention remains of a structure near the tree alongside of the vineyards
  - The village elders would likely not want children to go too far out of the village as occasionally wolves, bears and wild boars frequented it
  - The tree must have stood on the land of Messire Pierre de Bourlémont
  - The branches of the beech swept the ground. That means that for centuries farm animals must not have been able to reach it.
  - The spring was closer to the village than the tree according to Jean Morel
  - The tree was pretty close to the tree. A 700 meter walk does not feel like pretty close.
  - The fact that the children danced around the tree makes it likely that the tree was in a clearing, not in a dense forest and not on a steep slope.
  - When Domremy was raided, the villagers fled to Neufchateau with their livestock. That implies that the road to Neufchateau was safe and passable for cows, horses, and children. Most likely they would have taken the ridge road to Neufchateau, which is the D53 today. That road avoids crossing through the pro Burgundian village of Coussey. 
  - Jeanne D'Arc said that she heard the voices of the saints at the spring, not at the tree which implies that the tree was not at the spring. The tree and the spring were separate locations.
  - If "Fontem Rannorum" translates to "the spring of the frogs" then it is likely that the spring was a wetland area with frogs, not a dry area with a tree. The spring was likely in a low-lying area, not on the ridge.
  - Consequenty, it is possible to see the vineyards from the other side of the river
  - That line on the map may not accurately represent the old road
  - The ridge road could have been more to the west than the current D53
  - In the 100 years war, it would have been wise to travel over the west bank as that was France as opposed to the East bank
  - The stream La Saonelle is not wide, and it must have been passable, it would have been protected by Armagnac soldiers when the villagers of Domremy fled
  - The ridge may have become narrow because a fountain washed out sand from the hill over centuries.
  - In the 100 years war, it would have been wise to travel over the west bank as that was France as opposed to the East bank because on the East Bank they may be welcomed with stones.
  - Jeanne's healing fountain is not necessarily the fountain that was mentioned by the witnesses, “fountain of the frogs”
  
  obervation-list:
  - source: naudin-map
    remarks:
    - The path from Domremy goes up the ridge and stops at the entry of the shoulder of the hill.
    - Where the path leads to the plateau, there is also a spot where the ridge becomes more narrow. The fountain may have washed out the path and made it smaller.
    - Label this path as the ridge old road
    - Let us refer to this path as the ridge road
  - source: jollois
    remarks:
    - The vineyard grew on both sides of the ridge road
    - From the old ridge road it is possible to see the NEW road to Neufchateau on the other side of the river
  - source: Carte de L'etat major 1820-1866
    remarks:
    - The old ridge road ends stops where the basilique begins
    - The map shows that South of the basilique the territory of Coussey starts in the Napoleonic times
    - There is a patch of land next to the river Meuse called "la Fontaine aux Groselles"
    - The ridge road could have been more to the west than the current D53
  - source: LiDar Scan
    remarks:
    - there are traces in the landscape from what could have been the fountain washing over the road into the lower road, just north where the plateau begins.

