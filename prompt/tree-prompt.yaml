  - place the various objects to each other in terms of their locations to each other
  - seperate the facts from the Hercule Poirot interpretation
  - consider the location where vineyards grow
  - let poirot explain why he went to France during his holiday and why the location of the tree intrigued him
  - let poirot give the contemporary witness accounts the highest value
  performance-description:
  - give me the best location of the spring and the tree and explain your reasoning
  personal-observations:
  - Michel de montaigne does not mention remains of a religious artifact near the tree alongside of the vineyards
  - The villagers would not want children to go too far out of the village as occasionally wolves, bears and wild boars frequented it

