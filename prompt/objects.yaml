# Generated by the extract-objects skill (.claude/skills/extract-objects)
# from prompt/tree-prompt.yaml.
#
# object-types: inanimate objects named or described in first-hand-snippets
#   (direct witness testimony) only.
# context-only-object-types: inanimate objects that appear only in
#   general-reputation, observation-list, or personal-musings — never
#   first-hand evidence. Kept in a separate key on purpose so the two are
#   never confused.
#
# Note on citation density: where a generic consumable (pain, vin, oeuf,
# noix, eau) or the most commonly-named tree/fountain is repeated almost
# verbatim by many questionnaire-lorraine witnesses, one representative
# quote is kept and the other witnesses are named in a `note` rather than
# fully re-quoted — mirroring the compression convention already used in
# prompt/entities.yaml for collective types.

object-types:

  arbre:
    - name: l'arbre des Dames
      document-reference: bibliotheque-monastique
      quote: "Il y avait chez nous un arbre que, depuis l'ancien temps, on nommait l'arbre des Dames."
      note: >
        This exact name is also used in anonymous bibliotheque-monastique
        testimony describing the same Fountain-Sunday custom (several more
        snippets, none individually named). Jeanne D'Arc's own testimony
        (next entry) explicitly states this is the same tree as "l'arbre
        des Fées" below. Also the primary name used by named
        questionnaire-lorraine witnesses: Jean Morel, Dominique Jacob,
        Béatrice (veuve de Thévenin d'Estellin), Jeanette (femme de
        Thévenin Le Royer), Thévenin Le Royer, Jaquier de Saint-Amant,
        Bertrand Lacloppe, Perrin Drappier, Hauviette, Jean Waterin,
        Gérardin d'Épinal, Simonin Musnier, Jean Jaquard, and in Latin by
        dep_gerardin_epinal ("l'obre dominarum") and dep_jean_morel ("arbore
        que dicitur dominarum").
    - name: l'arbre des Fées
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "Près de Domrémy il y avait un arbre appelé l'arbre des Dames ; d'autres l'appelaient l'arbre des Fées."
      note: >
        Jeanne d'Arc herself states these are two names for the same tree —
        this is the stated equivalence, so "l'arbre des Dames" and "l'arbre
        des Fées" are kept as two instances rather than one, per the
        skill's synonym rule. Also named by Jeanne elsewhere ("j'ai ouï
        conter par mon frère qu'on disait dans le pays: « Jeannette a pris
        son fait près de l'arbre des Fées »"), by the condemnation judges'
        passage ("appelé communément l'arbre des fées"), by Gérard
        Guillemette ("L'a souvent entendu appeler l'arbre des fées"), and
        corroborated by three parallel interro_public3 transcriptions of
        Jeanne's "l'arbre des Dames... l'arbre des Fées" statement (modern
        French, Latin "Arborem Fatalium des Faées", archaic French "l'arbre
        des Fees").
    - name: aux Loges-les-Dames (also "Aux loges des Dames" / "Les loges des dames" / "ad lobias dominarum")
      document-reference: bibliotheque-monastique
      quote: "Il y avait chez nous un arbre qu'on appelait aux Loges-les-Dames."
      note: >
        Spelling-variant cluster: also "Aux loges des Dames" (Isabelle,
        femme de Gérardin d'Épinal), "Aux loges des dames" (Colin, fils de
        Jean Colin), "Les loges des dames" (Michel Le Buin), "les Loges des
        dames" (Henri Arnolin), and Latin "ad lobias dominarum" (dep_mengette).
        Also bibliotheque-monastique: "les seigneurs du village et leurs
        dames allaient prendre du bon temps aux Loges-les-Dames." Judgment
        call: every witness using this name describes the identical
        Fountain-Sunday custom (dancing, bread, the fountain afterward) as
        witnesses who say "l'arbre des Dames" — almost certainly the same
        tree — but no single snippet states that equivalence outright, so
        it is kept as its own instance rather than merged, per the "don't
        silently merge" rule.
    - name: le Fou (also "fau" / Latin "Fagus")
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "Il y a un grand arbre appelé le Fou, d'où vient le beau mai."
      note: >
        Introduced in the sentence immediately following Jeanne's "l'arbre
        des Dames... l'arbre des Fées" statement, in her own continuous
        testimony — read together, "cet arbre"/"le Fou" is the same tree.
        Corroborated by three parallel interro_public3 transcriptions:
        modern French "appelé fau d'où vient le beau mai"; Latin "vocata
        Fagus, unde venit mayum, le beau may"; archaic French "nommé fou,
        dont vient de beau may." "Fou"/"fau"/"Fagus" is literally the
        period word for "beech tree" — this may be a descriptive common
        noun rather than a distinct proper name for the tree, flagged as a
        judgment call rather than resolved.

  bois:
    - name: un Bois
      document-reference: questionnaire-lorraine
      from: Jean Moen
      quote: "L'arbre mentionné est près d'un bois, au bord du grand chemin par lequel on va à Neufchâteau."
    - name: le Bois Chenu (also "le Bois-Chenu" / Latin "Nemus-quercosum" / archaic French "le Bosc Chesnu")
      document-reference: interro_public3
      from: Jeanne D'Arc
      quote: "il y a un bois chenu qu'on voit de l'huis de sa maison de son père ; et n'y a pas la distance qu'une demi-lieue."
      note: >
        Parallel Latin: "est ibi unum nemus, quod vocatur Nemus-quercosum,
        le Bois-Chenu quod videtur ab ostio patris sui ; et non est
        distantia dimidiæ [leucae]"; archaic French: "ung bosc, que on
        appelle le Bosc Chesnu, que on voit de l'huys de son pere ; et y a
        petite espace non pas d'une lieue." Distinct, more specific wood
        than Jean Moen's generic "un bois" above — no first-hand snippet
        states a relationship between the two (matches the isolated-entity
        judgment call already made for this wood in breakout/combined.md).

  charrue:
    - name: la charrue du père de Jeanne
      document-reference: questionnaire-lorraine
      from: Jean Waterin
      quote: "Dans sa jeunesse il alla avec elle à la charrue du père de Jeanne, ou avec d'autres jeunes filles et elle dans les pâtures et les prés."

  château:
    - name: "(unspecified, no proper name given — le château du village)"
      document-reference: bibliotheque-monastique
      quote: "Quand le château était en prospérité, les seigneurs du village et leurs dames allaient prendre du bon temps aux Loges-les-Dames."

  chemin:
    - name: le grand chemin par lequel on va à Neufchâteau
      document-reference: questionnaire-lorraine
      from: Béatrice, veuve de Thévenin d'Estellin
      quote: "Cet arbre se trouve à côté du grand chemin par lequel on va à Neufchâteau."
      note: >
        Also named by Jean Moen: "L'arbre mentionné est près d'un bois, au
        bord du grand chemin par lequel on va à Neufchâteau."

  coudrier:
    - name: un coudrier (s'élevant au-dessus de la mandragore)
      document-reference: interro_public5
      from: Jeanne D'Arc
      quote: "Et dit qu'elle a ouï dire que sur cette mandragore s'élève un coudrier."
      note: 'Parallel Latin: "Dicit etiam se audivisse dici quod supra illam mandragoram est una corylus."'

  croix:
    - name: "(unspecified — les croix portées par les champs)"
      document-reference: questionnaire-lorraine
      from: Béatrice, veuve de Thévenin d'Estellin
      quote: "La veille de l'Ascension, quand le curé porte les croix par les champs, il va lui aussi sous cet arbre et y chante l'évangile."

  cierge:
    - name: "(unspecified — des cierges)"
      document-reference: questionnaire-lorraine
      from: Jean Waterin
      quote: "Elle portait souvent des cierges et allait au pèlerinage de Notre-Dame de Bermont."

  eau:
    - name: "(unspecified — l'eau/de aqua de la fontaine)"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "J'ai ouï dire que les fiévreux boivent de cette fontaine et y vont quérir de l'eau pour se remettre en santé."
      note: >
        "Boivent/boivent de son eau" repeated by Jean Morel, Dominique
        Jacob, Béatrice, Jeanette (femme de Thévenin Le Royer), Gérard
        Guillemette, and Jean Jaquard, and in Latin by dep_gerardin_epinal
        ("bibunt de aqua illius") and dep_jean_morel ("de aqua illius
        fontis bibunt").

  église:
    - name: l'église Notre-Dame de Bermont
      document-reference: questionnaire-lorraine
      from: Gérard Guillemette
      quote: "Les jeunes filles et jeunes gens de Greux vont faire leurs fontaines à l'église Notre-Dame de Bermont."
      note: >
        Jean Waterin separately states Jeanne "allait au pèlerinage de
        Notre-Dame de Bermont" — almost certainly the same shrine, referred
        to by its pilgrimage rather than its building, but no snippet
        states the two mentions are the same place outright; flagged
        rather than merged.

  évangile:
    - name: l'évangile de saint Jean
      document-reference: questionnaire-lorraine
      from: Jean Morel
      quote: "mais, à ce qu'on dit, après une lecture de l'évangile de saint Jean, elles n'y vont plus."
    - name: "(unspecified gospel passage, chanted by le curé)"
      document-reference: questionnaire-lorraine
      from: Béatrice, veuve de Thévenin d'Estellin
      quote: "il va lui aussi sous cet arbre et y chante l'évangile, ainsi qu'à la fontaine aux Rains et aux autres fontaines."

  fleur:
    - name: "(unspecified — des fleurs/flores)"
      document-reference: questionnaire-lorraine
      from: Nicolas Bailly
      quote: "elles y font des rondes et cueillent des fleurs."
      note: >
        Also Jean Morel: "autour s'amusent à cueillir des fleurs," and his
        Latin deposition: "circumcirca ludendo flores colligunt."

  fontaine:
    - name: la Fontaine-des-Groseilliers
      document-reference: bibliotheque-monastique
      quote: "allaient à l'arbre des Dames et à la Fontaine-des-Groseilliers, le dimanche de Laetare Jerusalem, appelé le dimanche des Fontaines."
      note: "Repeated across several more anonymous bibliotheque-monastique testimonies describing the same custom."
    - name: fontaine aux Rains (also "fontaine des Rains")
      document-reference: questionnaire-lorraine
      from: Jean Morel
      quote: "en revenant ils vont à la fontaine aux Rains, qui est plus près du village que l'arbre, en se promenant et chantant, y boivent son eau."
      note: >
        Spelling variant "fontaine des Rains" used by Dominique Jacob,
        Jeanette (femme de Thévenin Le Royer), Béatrice, Perrin Drappier,
        Gérard Guillemette, Hauviette, Jean Waterin, Gérardin d'Épinal,
        Simonin Musnier, Isabelle, Colin fils de Jean Colin, Michel Le
        Buin, and Jean Jaquard — treated as one instance, the spelling
        difference being orthographic rather than a stated distinction.
    - name: Fontem Rannorum (also "fontem ad Rannos")
      document-reference: dep_gerardin_epinal
      from: Gérardin d'Épinal
      quote: "et postea redeunt ad fontem rannorum ; et comedunt panem, et bibunt de aqua illius, prout vidit."
      note: >
        Also dep_mengette: "postea veniebant bibitum ad fontem rannorum";
        dep_jean_morel: "redeundo veniunt supra fontem ad Rannos... nec ad
        fontem, qui fens est propinquior villa quam sit arbor." Per
        breakout/combined.md's judgment call, almost certainly the same
        real fountain as "fontaine aux Rains" above (same return-walk
        scene, even in Gérardin d'Épinal's own French-summarized
        testimony), but no single snippet states that equivalence
        outright, so it is kept as a separate instance.
    - name: "(unspecified, no proper name given — fountain immediately adjacent to the tree)"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "Auprès est une fontaine."
      note: >
        Never given a proper name in any first-hand snippet. Also Jeanne's
        confirmed interrogation answer: "la fontaine proche de l'arbre";
        Bertrand Lacloppe: "à la fontaine proche"; the condemnation
        judges' passages: "lesdits arbre et fontaine [de Domremy]" and
        "une fontaine, située près d'un grand arbre"; three parallel
        interro_public3 transcriptions of Jeanne's "auprès est une
        fontaine" (French/Latin "juxta quam est unus fons"/archaic French
        "auprez a une fontaine"); and two parallel interro_public5
        transcriptions ("la fontaine qui est près de l'arbre"/Latin "apud
        fontem qui est juxta arborem"). Grouped as one instance on the
        "adjacent to the tree" wording ("auprès"/"proche"/"juxta") — the
        same judgment call breakout/combined.md makes for its "fontaine
        fiévreux" diagram node. That label itself comes from
        `object-model`/secondary sources and is never literally used by a
        witness.
    - name: "(unspecified, no proper name given — plural/unqualified \"fontaines\", not tied to any single named spring)"
      document-reference: questionnaire-lorraine
      from: Jean Moen
      quote: "vont aux fontaines près de cet arbre pour boire."
      note: >
        Also Béatrice: "ainsi qu'à la fontaine aux Rains et aux autres
        fontaines"; Jean Waterin: "vont à la fontaine des Rains ou parfois
        à d'autres fontaines." Kept apart from "fontaine aux Rains" and the
        adjacent-fountain instance because the text itself is
        unqualified/plural and doesn't pick out a single fountain —
        matching the reasoning breakout/combined.md applies to this exact
        Jean Moen wording.

  guirlande:
    - name: "(unspecified — guirlandes, also called \"chappeaulx\"/\"couronnes\"/Latin \"serta\")"
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "j'y faisais des guirlandes pour l'image de la Notre-Dame de Domrémy."
      note: >
        Same object under different words across snippets: an anonymous
        bibliotheque-monastique witness ("J'ai vu des filles mettre des
        guirlandes aux branches de cet arbre"); Jeanne's own answer in a
        separate interrogation ("quant elle mectoit chappeaulx en
        l'arbre... R. Que non"); the condemnation judges' passage ("des
        guirlandes formées de diverses herbes et fleurs"); and three
        parallel interro_public3 transcriptions ("couronnes"/Latin
        "serta"/archaic French "chappeaux").

  herbe:
    - name: "(unspecified — diverses herbes, garland material)"
      document-reference: bibliotheque-monastique
      quote: "elle appendait aux branches de l'arbre des guirlandes formées de diverses herbes et fleurs."

  image:
    - name: l'image de la Notre-Dame de Domrémy
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "j'y faisais des guirlandes pour l'image de la Notre-Dame de Domrémy."
      note: >
        Corroborated by three parallel interro_public3 transcriptions:
        modern French "l'image de Notre-Dame de Domrémy"; Latin "imagine
        Beate Mariæ de Dompremi"; archaic French "Nostre Dame de Dompremy."

  mai:
    - name: le beau mai (also "beau may" / Latin "mayum")
      document-reference: bibliotheque-monastique
      from: Jeanne D'Arc
      quote: "Il y a un grand arbre appelé le Fou, d'où vient le beau mai."
      note: >
        The May-Day bough harvested from "le Fou"/the tree, distinct from
        the tree itself. Corroborated by three parallel interro_public3
        transcriptions ("le beau mai"/Latin "mayum, le beau may"/archaic
        French "de beau may").
    - name: un homme de mai
      document-reference: questionnaire-lorraine
      from: Colin, fils de Jean Colin
      quote: "Parfois, le jour des Fontaines, ils font un homme de mai et apportent de petits pains, chacun ayant le sien."
      note: "A May-Day effigy, distinct from \"le beau mai\" bough above — both use the period word \"mai\" but name different objects."

  maison:
    - name: "(unspecified — la maison de son père, et son huis/porte)"
      document-reference: interro_public3
      from: Jeanne D'Arc
      quote: "il y a un bois chenu qu'on voit de l'huis de sa maison de son père."
      note: >
        Parallel Latin: "quod videtur ab ostio patris sui"; archaic
        French: "que on voit de l'huys de son pere."

  mandragore:
    - name: "(unspecified — une mandragore dans la terre, près de l'arbre ; jamais vue par Jeanne elle-même)"
      document-reference: interro_public5
      from: Jeanne D'Arc
      quote: "elle ouït dire qu'elle est en terre, proche de l'arbre ci-dessus mentionné; mais ne sait le lieu."
      note: >
        Parallel Latin: "audivit dici quod prope villam suam est una
        [mandragora], et nunquam vidit aliquam... in terra, prope illam
        arborem de qua superius dictum est."

  nappe:
    - name: "(unspecified — la nappe/mappam)"
      document-reference: bibliotheque-monastique
      quote: "Que de fois nous avons mis la nappe sous l'arbre et mangé ensemble!"
      note: 'Also dep_mengette (Latin): "Aliquando habebant unam mappam subtus illam arborem."'

  noix:
    - name: "(unspecified — des noix)"
      document-reference: bibliotheque-monastique
      quote: "Les petits du village, filles et garçons, avec du pain et des noix, allaient à l'arbre des Dames et à la Fontaine-des-Groseilliers."
      note: 'Also Hauviette: "Elle a vu porter des noix autour de cet arbre et aux fontaines."'

  oeuf:
    - name: "(unspecified — des oeufs)"
      document-reference: bibliotheque-monastique
      quote: "On emportait du pain, des oeufs, du vin."
      note: 'Also Perrin Drappier: "ils portaient du pain et du vin avec des œufs."'

  pain:
    - name: "(unspecified — du pain/des petits pains/panem)"
      document-reference: bibliotheque-monastique
      quote: "On emportait du pain, des oeufs, du vin."
      note: >
        "Pain"/"petits pains" repeated by nearly every questionnaire-lorraine
        witness describing the Fountain-Sunday custom (Dominique Jacob,
        Béatrice, Jeanette femme de Thévenin Le Royer, Thévenin Le Royer,
        Jaquier de Saint-Amant, Perrin Drappier, Hauviette, Jean Waterin,
        Gérardin d'Épinal, Simonin Musnier, Isabelle, Colin fils de Jean
        Colin, Jean Jaquard), and in Latin by dep_gerardin_epinal
        ("panem"), dep_mengette ("parvis panibus"), and three parallel
        interro_public3 transcriptions of Jeanne's own testimony.

  vin:
    - name: "(unspecified — du vin)"
      document-reference: bibliotheque-monastique
      quote: "On emportait du pain, des oeufs, du vin."
      note: >
        Also Perrin Drappier ("ils portaient du pain et du vin avec des
        œufs") and Gérardin d'Épinal ("qui portaient du vin et du pain et
        allaient manger sous l'arbre").

context-only-object-types:

  acte:
    - name: l'acte d'accensement des biens en faveur de Gérardin d'Epinal (1442)
      section: general-reputation
      document-reference: dep_gerardin_epinal
      quote: "Il semble que sur l'acte d'accensement des biens en faveur de Gérardin d'Epinal en 1442 (photo), les termes \"La Loge les Dames\" (arbre des fées) et \"Grouselier\" accrédite la traduction \"fontaine des groseilles\"."

  arbre:
    - name: l'arbre de la Pucelle
      section: general-reputation
      document-reference: michel-montaigne
      quote: "There is also a tree beside a vineyard which they call “l’arbre de la Pucelle,” but there is nothing remarkable about it."
    - name: l'Arbre des Fées (academie-francaise retelling)
      section: general-reputation
      document-reference: academie-francaise
      quote: "On banquetait sous l'Arbre des Fées, un hêtre colossal et très vieux, dont les branches et les rameaux touchaient presque terre, de manière à former comme une tente naturelle."
    - name: "l'arbre avait plusieurs noms (Arbre-des-Dames, Arbre-aux-Loges-les-Dames, Arbre-des-Fées, Arbre-Charmine-Fée-de-Bourlémont, le Beau-Mai)"
      section: general-reputation
      document-reference: mediterranee-antique
      quote: "l'arbre avait plusieurs noms. On l'appelait l'Arbre-des-Dames, l'Arbre-aux-Loges-les-Dames, l'Arbre-des-Fées, l'ArbreCharmine-Fée-de-Bourlémont, le Beau-Mai."
    - name: le grand Fau (biblisem retelling)
      section: general-reputation
      document-reference: biblisem
      quote: "La veille de l'Ascension, à la procession où les croix sont portées par les champs, le curé va sous le grand Fau et y chante l'évangile."

  autel:
    - name: "une pierre que l'on disait être le dessus de l'autel"
      section: general-reputation
      document-reference: jollois
      quote: "Ils assurent même avoir aperçu dans les décombres une pierre que l'on disait être le dessus de l'autel."

  basilique:
    - name: la basilique Sainte Jeanne à Domrémy
      section: general-reputation
      document-reference: balades-historiques
      quote: "Le lieu où se dresse aujourd'hui la basilique Sainte Jeanne à Domrémy est connu depuis l'origine de l'épopée johannique."
      note: >
        Also referenced in observation-list entries from carte-etat-major
        ("the old ridge road ends where the basilique begins") and
        napoleonic-cadastre ("the basilique begins").

  chapelle:
    - name: chapelle élevée par Étienne Hordal (1600–1610)
      section: general-reputation
      document-reference: balades-historiques
      quote: "Etienne Hordal – Chanoine de Toul et petit-neveu de Jeanne d'arc, y avait fait élever une chapelle entre 1600 et 1610 « au lieu même où l'on dit que Jeanne avait reçu de Dieu commandement d'aller trouver le Roi »."
    - name: chapelle de Notre-Dame (Bois Chenu)
      section: general-reputation
      document-reference: academie-francaise
      quote: "Le Bois Chenu lui-même devait avoir son sanctuaire ou son ermitage à la place où, au début du XVIIe siècle, Étienne Hordal fit construire sa chapelle de Notre-Dame."
      note: "Same Hordal chapel as above, described from the Bois Chenu side."
    - name: chapelle Notre-Dame de Domrémy (ruins)
      section: general-reputation
      document-reference: ste-jeannedarc.fr
      quote: "La chapelle dont il est ici parlé est nommée... Notre-Dame de Domrémy, et ne doit pas être confondue avec l'ermitage de Notre-Dame de Bermont, situé de l'autre côté de Domrémy."
      note: >
        The source explicitly distinguishes this from "l'ermitage de
        Notre-Dame de Bermont" below. Also jollois: "Il ne reste plus rien
        aujourd'hui dans cet emplacement, qu'un énorme tas de pierres..."
        and jeanne.wiki: "la Basilique en construction a pour assises les
        ruines d'une antique chapelle, dont le constructeur fut Étienne
        Hordal."

  châsse:
    - name: la Châsse de sainte Libaire
      section: general-reputation
      document-reference: academie-francaise
      quote: "elle avait dû aller en pèlerinage à la Châsse de sainte Libaire, conservée à l'église de Grand."

  chemin:
    - name: the ridge (old) road
      section: observation-list
      document-reference: naudin-map
      quote: "The path from Domremy goes up the ridge and stops at the entry of the shoulder of the hill."
      note: >
        Also carte-etat-major: "The ridge road could have been more to the
        west than the current D53"; jollois observation: "From the old
        ridge road it is possible to see the NEW road to Neufchateau on
        the other side of the river"; personal-musings: "Most likely they
        would have taken the ridge road to Neufchateau, which is the D53
        today."
    - name: the road to Neufchâteau (new road, far bank)
      section: observation-list
      document-reference: jollois
      quote: "From the old ridge road it is possible to see the NEW road to Neufchateau on the other side of the river."

  clocher:
    - name: le clocher de Saint-Elophe
      section: general-reputation
      document-reference: academie-francaise
      quote: "De la lisière du Bois Chenu ou de l'Arbre des Fées, Jeanne pouvait apercevoir, pour ainsi dire à portée de la main, le clocher de Saint-Elophe."

  ermitage:
    - name: l'ermitage de Notre-Dame de Bermont
      section: general-reputation
      document-reference: ste-jeannedarc.fr
      quote: "ne doit pas être confondue avec l'ermitage de Notre-Dame de Bermont, situé de l'autre côté de Domrémy."
      note: >
        Distinguished by the source itself from "chapelle Notre-Dame de
        Domrémy" above. This is a general-reputation description of the
        same shrine the first-hand `église` entries (l'église/pèlerinage
        Notre-Dame de Bermont) refer to.

  fontaine:
    - name: fontaine aux Groseilliers (also "fontaine aux Groselles"/"Grouselier")
      section: general-reputation
      document-reference: biblisem
      quote: "Il va aussi à la Fontaine aux Groseilliers et aux autres fontaines pour chanter l'évangile ; ce sont faits que j'ai vus."
      note: >
        Spelling-variant cluster "fontaine aux Groselles"/"Grouselier" also
        appears in the dep_gerardin_epinal editorial aside and the
        napoleonic-cadastre observation-list entry ("There is a patch of
        land next to the river Meuse called 'la Fontaine aux Groselles'").
        Plausibly the same real fountain as the first-hand "la
        Fontaine-des-Groseilliers," but kept as a separate, non-first-hand
        instance per the never-merge rule.
    - name: la fontaine de l'Ermite
      section: general-reputation
      document-reference: jollois
      quote: "L'arbre des fées était placé près d'une fontaine qui, d'après ce qu'en rapportent les plus anciens de Domremy, s'appelait la fontaine de l'Ermite."
    - name: la fontaine élevée sur la place de Domremy (1821 monument, "source des Groseillers")
      section: general-reputation
      document-reference: jollois
      quote: "Le monument consiste en une fontaine d'eaux jaillissantes amenées de la source des Groseillers, située à sept cents mètres de distance de la place de Domremy."
    - name: "fontaine des grenouilles (speculative reading of \"fontaine des Rains\")"
      section: general-reputation
      document-reference: dep_gerardin_epinal
      quote: "Cette fontaine des Rains est souvent traduite par fontaine des \"groseilles\". Certains ont dit que \"rains\" pourrait être \"grenouilles\"."
      note: >
        Carried forward in personal-musings: "If \"Fontem Rannorum\"
        translates to \"the spring of the frogs\" then it is likely that
        the spring was a wetland area with frogs..." and the standalone
        Hypothesis note: "Jeanne's healing fountain ≠ the later/other
        'fountain of the frogs'." Purely an editorial/etymological
        speculation, not stated by any witness.
    - name: "(unspecified — fountain washout near the plateau edge)"
      section: observation-list
      document-reference: naudin-map
      quote: "Where the path leads to the plateau, there is also a spot where the ridge becomes more narrow. The fountain may have washed out the path and made it smaller."
      note: >
        Also Carte de L'etat major 1820-1866 ("There is a patch of land
        next to the river Meuse called 'la Fontaine aux Groselles'") and
        LiDar Scan ("traces in the landscape from what could have been the
        fountain washing over the road into the lower road").

  monument:
    - name: le monument (1821 fountain monument on the Domremy village square)
      section: general-reputation
      document-reference: jollois
      quote: "Le monument plus spécialement consacré à rappeler la mémoire de l'héroïne du quinzième siècle est érigé sur la place de Domremy."

  pierre:
    - name: "un énorme tas de pierres (chapel ruins)"
      section: general-reputation
      document-reference: jollois
      quote: "Il ne reste plus rien aujourd'hui dans cet emplacement, qu'un énorme tas de pierres ramassées dans les champs par les cultivateurs."

  ruines:
    - name: "des ruines / des décombres (old chapel site)"
      section: general-reputation
      document-reference: ste-jeannedarc.fr
      quote: "On en montre encore l'emplacement, signalé naguère par des ruines et aujourd'hui par des décombres, vers le lieu où la tradition plaçait l'arbre des Dames."

  ruisseau:
    - name: La Saonelle
      section: personal-musings
      quote: "The stream La Saonelle is not wide, and it must have been passable, it would have been protected by Armagnac soldiers when the villagers of Domremy fled."

  statue:
    - name: la statue de l'héroïne (brisée à Orléans)
      section: general-reputation
      document-reference: jollois
      quote: "la statue de l'héroïne fut brisée à Orléans."

  vigne:
    - name: "(unspecified — a vineyard beside the tree)"
      section: general-reputation
      document-reference: michel-montaigne
      quote: "There is also a tree beside a vineyard which they call “l’arbre de la Pucelle”."
    - name: "(unspecified — the vineyard on both sides of the ridge road)"
      section: observation-list
      document-reference: jollois
      quote: "The vineyard grew on both sides of the ridge road."
